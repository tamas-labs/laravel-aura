name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                laravel: ['12', '13']
                include:
                    - laravel: '12'
                      testbench: '^10.0'
                    - laravel: '13'
                      testbench: '^11.0'
                    # Coverage is measured on one leg only: the number
                    # does not differ per leg — the suite is the same — and pcov
                    # on all six would only cost time. Not the newest leg on
                    # purpose; the coverage driver is the part of a toolchain
                    # that lags a new PHP release, and a missing one here would
                    # fail a job that is not about PHP 8.5 at all.
                    - php: '8.4'
                      laravel: '13'
                      coverage: 'pcov'

        steps:
            - uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, zip, intl, pdo_sqlite
                  ini-values: memory_limit=-1
                  coverage: ${{ matrix.coverage || 'none' }}

            # `--with` applies the matrix constraint to this run alone.
            # `composer require --no-update` would write it into composer.json,
            # and the suite reads composer.json as the source of truth for the
            # requirement lists both READMEs have to quote — so the pin failed
            # the very tests that guard it, on every leg. `VersioningTest` now
            # refuses a workflow that edits the manifest.
            - name: Install the dependencies for this leg
              run: |
                  composer update --prefer-dist --no-interaction --no-progress \
                      --with "illuminate/contracts:^${{ matrix.laravel }}.0" \
                      --with "illuminate/support:^${{ matrix.laravel }}.0" \
                      --with "orchestra/testbench:${{ matrix.testbench }}"

            - name: Check formatting
              run: vendor/bin/pint --test

            - name: Static analysis
              run: vendor/bin/phpstan analyse --no-progress

            - name: Tests
              if: matrix.coverage == ''
              run: vendor/bin/pest

            # `--min` fails the run below the threshold, so the gate is the
            # number itself and not a report nobody reads.
            - name: Tests with coverage
              if: matrix.coverage != ''
              run: composer test:coverage

    bc:
        name: Backward compatibility
        runs-on: ubuntu-latest

        steps:
            # The check compares HEAD against the last tagged minor version, so
            # the tags have to be present: with the shallow default clone
            # `git tag -l` comes back empty, the guard below finds no baseline,
            # and the job goes green having compared nothing. `VersioningTest`
            # pins this line for that reason.
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # Nothing to compare against until the first release. The step turns
            # the check on by itself at the first tag, rather than leaving a
            # follow-up commit as the only thing between a release and an
            # unguarded API.
            - name: Look for a baseline to compare against
              id: baseline
              run: |
                  if git tag -l | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "released=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "released=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::No stable release tag in this repository yet, so there is no published API to compare against. The check starts running at the first tag."
                  fi

            - name: Set up PHP
              if: steps.baseline.outputs.released == 'true'
              uses: shivammathur/setup-php@v2
              with:
                  # The tool requires PHP 8.4; this package's own `^8.3` floor
                  # does not apply, because the two are never installed into the
                  # same directory.
                  php-version: '8.4'
                  extensions: dom, simplexml, mbstring, zip
                  ini-values: memory_limit=-1
                  coverage: none

            # Reads the `autoload` paths out of composer.json, so it sees `src/`
            # and neither the tests nor the workbench. Symbols carrying
            # `@internal` are skipped, and adding `@internal` to one that did not
            # have it is itself reported — the same line F6.4 draws.
            - name: Check for backward incompatible changes
              if: steps.baseline.outputs.released == 'true'
              run: composer bc-check

    docker:
        name: Docker image
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # Local development happens exclusively in this image (see CLAUDE.md),
            # so build it and run the suite inside it to keep it from rotting.
            # The runner's uid is not 1000, so the image user has to match it or
            # the bind-mounted checkout is read-only inside the container.
            - name: Build the development image
              run: docker compose build --build-arg UID=$(id -u) --build-arg GID=$(id -g) php

            # composer.lock is not committed (this is a library), so update, not install.
            - name: Install dependencies in the container
              run: docker compose run --rm php composer update --no-interaction --no-progress

            - name: Run the quality gate in the container
              run: docker compose run --rm php composer quality

            # After the gate, never before: the build writes a `.env` into
            # Testbench's skeleton. It proves `testbench.yaml` still describes a
            # bootable application — the migrations and the seeder are covered
            # by the suite, the build recipe itself is not.
            - name: Build the demo application
              run: docker compose run --rm php composer build
